[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchpad"
version = "0.1.0"
description = "A persistent task and notes pad for agent orchestrators"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "orchpad contributors" }]
keywords = ["tasks", "notes", "agents", "orchestration", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
orchpad = "orchpad.cli:main"
op = "orchpad.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/pom11/orchpad"

[tool.hatch.build.targets.wheel]
packages = ["orchpad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
